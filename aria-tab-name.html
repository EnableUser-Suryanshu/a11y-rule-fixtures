<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibility test page: aria-tab-name</title>
<style>body{font-family:Arial,sans-serif;margin:24px;color:#1a1a1a;background:#fff}.note{color:#444}</style>
</head>
<body>
<header><p class="note">Test fixture for automated accessibility checking.</p></header>
<main>
<h1>Test page: ARIA tab nodes must have an accessible name</h1>
<div role="tablist" aria-label="Account sections"><button role="tab" aria-selected="true" aria-controls="p1" id="t1" data-fixture="pass">Holdings</button><div role="tab" tabindex="-1" aria-selected="false" aria-controls="p2" id="t2" data-fixture="fail"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6"/></svg></div></div>
<div role="tabpanel" id="p1" aria-labelledby="t1">Holdings panel</div><div role="tabpanel" id="p2" hidden>Orders panel</div>
</main>
</body>
</html>
